name: Debian 13 test package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debian:
    runs-on: ubuntu-24.04
    container: debian:13
    steps:
      - name: Install Debian build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential cmake ninja-build dpkg-dev qt6-base-dev qt6-qpa-plugins fonts-dejavu-core desktop-file-utils shared-mime-info
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and test
        run: |
          cmake -S . -B build-debian -G Ninja -DCMAKE_BUILD_TYPE=Release -DKLEIOTIDE_BUILD_RELEASE_CHECKS=ON -DKLEIOTIDE_PACKAGE_DEBIAN=ON
          cmake --build build-debian --target release-check --parallel 2
      - name: Make and inspect the package
        run: |
          desktop-file-validate tools/linux/*.desktop
          cpack --config build-debian/CPackConfig.cmake -B packages
          dpkg-deb --info packages/*.deb
          dpkg-deb --contents packages/*.deb
          apt-get install -y ./packages/*.deb
          dpkg-query -W kleiotide
          test -x /usr/bin/kleiotide
          grep -q '^application/x-kleiotide-session=.*io.github.Gurdhhu.Kleiotide.desktop' /usr/share/applications/mimeinfo.cache
          grep -Eq '^[0-9]+:application/x-abif:\*\.ab1$' /usr/share/mime/globs2
      - name: Upload the testing installer and test log
        uses: actions/upload-artifact@v4
        with:
          name: kleiotide-debian13-amd64
          path: |
            packages/*.deb
            build-debian/release-tests-Release.log
          if-no-files-found: error
